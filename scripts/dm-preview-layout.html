<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }}</title>
  <!-- Minimal stand-in for the site layout: enough of the real theme that the
       Messages page renders the way it will in production, without pulling in
       the navigation, analytics, or the rest of the site's stylesheet. Tokens
       are copied from _sass/open-coding/user-preferences.scss. -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --pref-bg-color: #0b1220;
      --pref-text-color: #e6eef8;
      --pref-font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
      --pref-font-size: 14px;
      --pref-accent-color: #3b82f6;
    }
    body {
      margin: 0;
      background: var(--pref-bg-color);
      color: var(--pref-text-color);
      font-family: var(--pref-font-family);
      font-size: var(--pref-font-size);
    }
    main { max-width: 1100px; margin: 0 auto; padding: 24px 20px 60px; }
    /* The real header is not part of this preview; a plain bar keeps the page
       from starting flush against the top of the window. */
    .dm-preview-bar {
      border-bottom: 1px solid #2A2D2D;
      padding: 10px 20px;
      color: #aaa;
      font-size: 12px;
    }
  </style>
</head>
<body class="dm-preview-page">
  <div class="dm-preview-bar">Local preview &middot; Messages</div>
  <main>{{ content }}</main>
</body>
</html>
